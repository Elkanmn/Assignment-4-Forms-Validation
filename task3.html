<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task 3 | Cafe reservation</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="style.css" rel="stylesheet"></head><body><nav class="navbar navbar-expand bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Assignment 4</a><div class="navbar-nav ms-auto gap-2"><a class="nav-link" href="index.html">Task 1</a><a class="nav-link" href="task2.html">Task 2</a><a class="nav-link" href="task3.html">Task 3</a></div></div></nav><main class="container py-5"><div class="simple-card mx-auto"><div class="card-top"><p class="eyebrow mb-1">WELCOME TO OUR CAFÉ</p><h1>Reserve a table</h1><p class="mb-0">Choose your preferred date and seating.</p></div><form class="p-4 p-md-5" action="#" method="get"><div class="row g-3"><div class="col-md-6"><label for="guestName" class="form-label">Your name *</label><input id="guestName" name="guestName" class="form-control" autocomplete="name" required></div><div class="col-md-6"><label for="guestEmail" class="form-label">Email *</label><input id="guestEmail" name="guestEmail" type="email" class="form-control" autocomplete="email" required></div><div class="col-md-6"><label for="guestPhone" class="form-label">Phone *</label><input id="guestPhone" name="guestPhone" type="tel" class="form-control" autocomplete="tel" required></div><div class="col-md-6"><label for="guests" class="form-label">Guests *</label><input id="guests" name="guests" type="number" min="1" max="20" step="1" class="form-control" required></div><div class="col-md-6"><label for="bookingDate" class="form-label">Date *</label><input id="bookingDate" name="bookingDate" type="date" class="form-control" required></div><fieldset class="col-md-6"><legend class="form-label">Seating *</legend><div class="d-flex gap-4"><div class="form-check"><input class="form-check-input" type="radio" id="inside" name="seating" value="inside" required><label for="inside" class="form-check-label">Inside</label></div><div class="form-check"><input class="form-check-input" type="radio" id="terrace" name="seating" value="terrace"><label for="terrace" class="form-check-label">Terrace</label></div></div></fieldset><div class="col-12"><label for="meal" class="form-label">Meal *</label><select class="form-select" id="meal" name="meal" required><option value="">Choose a meal...</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></div><div class="col-12"><label for="comments" class="form-label">Comments (optional)</label><textarea id="comments" name="comments" class="form-control" rows="3" placeholder="Anything we should know?"></textarea></div><div class="col-12"><div class="form-check"><input id="terms" name="terms" type="checkbox" class="form-check-input" required><label for="terms" class="form-check-label">I agree to the terms *</label></div></div></div><button type="submit" class="btn btn-book mt-4">Reserve table</button></form></div></main></body></html>
