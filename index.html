<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task 1 | Train tickets</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="style.css" rel="stylesheet"></head><body><nav class="navbar navbar-expand bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Assignment 4</a><div class="navbar-nav ms-auto gap-2"><a class="nav-link" href="index.html">Task 1</a><a class="nav-link" href="task2.html">Task 2</a><a class="nav-link" href="task3.html">Task 3</a></div></div></nav><main class="container py-5"><div class="ticket-card mx-auto"><div class="ticket-head">Book a train ticket</div><form class="ticket-body" action="#" method="get"><div class="mb-4"><div class="btn-group trip-toggle" role="group" aria-label="Trip type"><input type="radio" class="btn-check" name="trip" id="oneway" value="one-way" checked><label class="btn btn-outline-success" for="oneway">One way</label><input type="radio" class="btn-check" name="trip" id="roundtrip" value="round-trip"><label class="btn btn-outline-success" for="roundtrip">Round trip</label></div></div><div class="row g-3 mb-3"><div class="col-md-6"><label class="form-label" for="from">From</label><input id="from" name="from" class="form-control" required placeholder="Astana"></div><div class="col-md-6"><label class="form-label" for="to">To</label><input id="to" name="to" class="form-control" required placeholder="Almaty"></div></div><div class="row g-3 mb-4"><div class="col-md-4"><label class="form-label" for="departure">Departure</label><input type="date" id="departure" name="departure" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="returnDate">Return</label><input type="date" id="returnDate" name="return" class="form-control"></div><div class="col-md-4"><label class="form-label" for="passengers">Passengers</label><select id="passengers" name="passengers" class="form-select" required><option value="1">1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option><option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option></select></div></div><fieldset class="mb-4"><legend class="form-label">Carriage class</legend><div class="d-flex gap-3 flex-wrap"><div class="form-check"><input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required><label class="form-check-label" for="seat">Seat</label></div><div class="form-check"><input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked><label class="form-check-label" for="coupe">Coupé</label></div><div class="form-check"><input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper"><label class="form-check-label" for="sleeper">Sleeper</label></div></div></fieldset><div class="row g-3 mb-4"><div class="col-md-6"><label class="form-label" for="phone">Phone</label><div class="input-group"><span class="input-group-text phone-prefix">+7</span><input class="form-control" id="phone" name="phone" type="tel" required placeholder="701 234 56 78"></div></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required placeholder="name@example.com"></div></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="sms" name="sms"><label class="form-check-label" for="sms">Also send the ticket by SMS</label></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="agree" name="agree" required><label class="form-check-label" for="agree">I agree with the carriage rules</label></div><div class="d-flex gap-2 justify-content-end actions"><button type="reset" class="btn btn-clear">Clear</button><button type="submit" class="btn btn-book">Find trains</button></div></form></div></main></body></html>
